name: Pounce

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Emscripten
      uses: emscripten-core/setup-emsdk@v16
      with:
        version: 4.0.17

    - name: Copy the Pounce front end
      run: sh scripts/build-site.sh

    - name: Build Cob from source to WebAssembly
      run: bash scripts/build-wasm.sh

    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4